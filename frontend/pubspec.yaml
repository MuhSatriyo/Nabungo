name: nabungo
description: Nabungo - AI Financial Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.1

  # Routing
  go_router: ^13.0.1

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.1
  cached_network_image: ^3.3.0
  flutter_iconly: ^1.0.2

  # Utils
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.2
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1

  # Firebase (optional, for notifications)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # JSON serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
